<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabletop Map Workshop</title><style>body{background:#142336;color:#f1f4ee;font:17px system-ui;max-width:1100px;margin:30px auto;padding:20px}h1{font-size:42px}button,input,select,textarea{font:inherit;padding:9px;margin:5px;border-radius:5px}button{background:#9fe0bc;cursor:pointer;border:0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #496076;text-align:left}canvas{background:white;max-width:100%;touch-action:none}textarea{width:90%;min-height:110px}#status{min-height:24px}a{color:#9fe0bc}@media print{body{background:white;color:black}button,input,select{display:none}}</style><h1>Tabletop Map Workshop</h1><label>Terrain <select id="brush"><option value="0">Grass</option><option value="1">Wall</option><option value="2">Water</option><option value="3">Floor</option></select></label><select id="tool"><option>Paint</option><option>Flood fill</option><option>Token</option><option>Remove token</option></select><button id="undo">Undo</button><button id="save">Save browser</button><button id="export">Export JSON</button><input id="import" type="file" accept=".json"><button id="png">Export PNG</button><canvas id="map" width="1200" height="800" aria-label="Editable tile map"></canvas><p id="status" role="status"></p><script type="module">
import{fresh,fill,validate}from'/core.js';const el=id=>document.getElementById(id),canvas=el('map'),c=canvas.getContext('2d');let map=fresh(),history=[],painting=false;try{map=validate(JSON.parse(localStorage.getItem('tabletop-map')||JSON.stringify(map)));}catch(e){el('status').textContent=e.message;}function draw(){const colors=['#87b97c','#5b6473','#79b6d2','#d8c5a5'];for(let y=0;y<20;y++)for(let x=0;x<30;x++){c.fillStyle=colors[map.tiles[y][x]];c.fillRect(x*40,y*40,40,40);c.strokeStyle='#ffffff55';c.strokeRect(x*40,y*40,40,40);}c.font='14px sans-serif';for(const t of map.tokens){c.fillStyle='#b33d58';c.beginPath();c.arc(t.x*40+20,t.y*40+20,15,0,Math.PI*2);c.fill();c.fillStyle='black';c.fillText(t.label,t.x*40+2,t.y*40+38);}}function remember(){history.push(structuredClone(map));if(history.length>30)history.shift();}function edit(e,first){const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(29,Math.floor((e.clientX-r.left)/r.width*30))),y=Math.max(0,Math.min(19,Math.floor((e.clientY-r.top)/r.height*20))),tool=el('tool').value;if(tool==='Paint')map.tiles[y][x]=+el('brush').value;else if(first&&tool==='Flood fill')map=fill(map,x,y,+el('brush').value);else if(first&&tool==='Token'){const label=prompt('Token label (max 20 characters)');if(label!==null&&map.tokens.length<100)map.tokens.push({x,y,label:label.slice(0,20)});}else if(first&&tool==='Remove token')map.tokens=map.tokens.filter(t=>t.x!==x||t.y!==y);draw();}canvas.onpointerdown=e=>{remember();painting=true;canvas.setPointerCapture(e.pointerId);edit(e,true);};canvas.onpointermove=e=>{if(painting&&el('tool').value==='Paint')edit(e,false);};canvas.onpointerup=canvas.onpointercancel=()=>painting=false;el('undo').onclick=()=>{if(history.length){map=history.pop();draw();}};el('save').onclick=()=>{try{localStorage.setItem('tabletop-map',JSON.stringify(map));el('status').textContent='Saved locally.';}catch(e){el('status').textContent=e.message;}};function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}el('export').onclick=()=>download('map.json',new Blob([JSON.stringify(map,null,2)],{type:'application/json'}));el('import').onchange=async()=>{try{const f=el('import').files[0];if(f.size>1000000)throw Error('Import limit 1 MiB');const next=validate(JSON.parse(await f.text()));remember();map=next;draw();}catch(e){el('status').textContent=e.message;}};el('png').onclick=()=>canvas.toBlob(b=>{if(b)download('map.png',b);});draw();
</script></html>
